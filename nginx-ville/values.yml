image:
  registry: docker.io
  repository: nginx
  tag: 1.31.8-alpine@sha256:b2f80f8f88146b0772fdcc7d92cea621aa8c2889fa8d07ed61d4884fcea53e09
  pullPolicy: IfNotPresent

autoscaling:
  enabled: true
  minReplicas: "1"
  maxReplicas: "5"
  targetCPUUtilizationPercentage: "70"

resources:
  limits:
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

containerSecurityContext:
  capabilities:
    drop:
      - ALL

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

extraVolumes:
  - name: html
    persistentVolumeClaim:
      claimName: nginx-ville

extraVolumeMounts:
  - name: html
    mountPath: /usr/share/nginx/html