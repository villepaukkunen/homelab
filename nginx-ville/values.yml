image:
  registry: docker.io
  repository: nginx
  tag: 1.31.10-alpine@sha256:aceb952b920393b7d0bc7b978927fc283370bea89fb082c6fef0ce18c60f96a9
  pullPolicy: IfNotPresent

autoscaling:
  enabled: true
  minReplicas: "1"
  maxReplicas: "5"
  targetCPUUtilizationPercentage: "70"

resources:
  limits:
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

containerSecurityContext:
  capabilities:
    drop:
      - ALL

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

extraVolumes:
  - name: html
    persistentVolumeClaim:
      claimName: nginx-ville

extraVolumeMounts:
  - name: html
    mountPath: /usr/share/nginx/html