image:
  registry: docker.io
  repository: nginx
  tag: 1.31.7-alpine@sha256:892bb2152464f0c5d8972593a5f5afaf8054552580b699d95f8ff4af08c2d33d
  pullPolicy: IfNotPresent

autoscaling:
  enabled: true
  minReplicas: "1"
  maxReplicas: "5"
  targetCPUUtilizationPercentage: "70"

resources:
  limits:
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

containerSecurityContext:
  capabilities:
    drop:
      - ALL

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

extraVolumes:
  - name: html
    persistentVolumeClaim:
      claimName: nginx-ville

extraVolumeMounts:
  - name: html
    mountPath: /usr/share/nginx/html