image:
  registry: docker.io
  repository: nginx
  tag: 1.31.8-alpine@sha256:aa507585add4e2b7fff8b259e843249a42bfc2befd5af4c4c53fb73d41ac4316
  pullPolicy: IfNotPresent

autoscaling:
  enabled: true
  minReplicas: "1"
  maxReplicas: "5"
  targetCPUUtilizationPercentage: "70"

resources:
  limits:
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

containerSecurityContext:
  capabilities:
    drop:
      - ALL

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

extraVolumes:
  - name: html
    persistentVolumeClaim:
      claimName: nginx-ville

extraVolumeMounts:
  - name: html
    mountPath: /usr/share/nginx/html