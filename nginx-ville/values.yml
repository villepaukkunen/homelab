image:
  registry: docker.io
  repository: nginx
  tag: 1.31.8-alpine@sha256:1ef7ca94d7879df82421428ce13bd1eaa412404953859cf7a5b6512c25e67a60
  pullPolicy: IfNotPresent

autoscaling:
  enabled: true
  minReplicas: "1"
  maxReplicas: "5"
  targetCPUUtilizationPercentage: "70"

resources:
  limits:
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

containerSecurityContext:
  capabilities:
    drop:
      - ALL

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

extraVolumes:
  - name: html
    persistentVolumeClaim:
      claimName: nginx-ville

extraVolumeMounts:
  - name: html
    mountPath: /usr/share/nginx/html