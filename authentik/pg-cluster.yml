apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-pg
  namespace: authentik
spec:
  managed:
    services:
      disabledDefaultServices: ["ro"]
  instances: 2
  affinity:
    podAntiAffinityType: required
    nodeSelector:
      storage: longhorn
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-system-trixie
    major: 18
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      secret:
        name: authentik-postgres-credentials
  storage:
    storageClass: longhorn-single-replica
    size: 2Gi
