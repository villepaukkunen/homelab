apiVersion: apps/v1
kind: Deployment
metadata:
  name: mollysocket
  namespace: mollysocket
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mollysocket
  template:
    metadata:
      labels:
        app: mollysocket
    spec:
      securityContext:
        fsGroup: 101
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        storage: longhorn
      containers:
        - name: mollysocket
          image: ghcr.io/mollyim/mollysocket:1.7.1@sha256:552fc28429fd9a5c500971a8ab86f40ab65a9888b44d3d99509f783bddc208f4
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 101
            capabilities:
              drop:
              - ALL
          args: ["server"]
          workingDir: /data
          env:
            - name: MOLLY_DB
              value: "/data/mollysocket.db"
            - name: MOLLY_ALLOWED_UUIDS
              value: '["*"]'
            - name: MOLLY_HOST
              value: "0.0.0.0"
            - name: MOLLY_PORT
              value: "8020"
            - name: MOLLY_ALLOWED_ENDPOINTS
              value: '["https://cloud.mandariini.uk"]'
            - name: RUST_LOG
              value: "info"
          envFrom:
            - secretRef:
                name: envsecrets
          ports:
            - containerPort: 8020
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mollysocket
