---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  namespace: mealie
  labels:
    app: mealie
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mealie
  template:
    metadata:
      labels:
        app: mealie
    spec:
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        storage: longhorn
      containers:
        - name: mealie
          image: docker.io/hkotel/mealie:v3.29.0@sha256:78eb28b8776d0bad40c5e605c72b3f4f5976793e491558c7dcbdfc04c835d4bc
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 1000
            capabilities:
              drop:
              - ALL
          env:
            - name: ALLOW_SIGNUP
              value: 'false'
            - name: PUID
              value: '1000'
            - name: PGID
              value: '1000'
            - name: TZ
              value: Europe/Helsinki
            - name: BASE_URL
              value: https://mealie.mandariini.uk
            - name: DB_ENGINE
              value: postgres
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: mealie-postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mealie-postgres-credentials
                  key: password
            - name: POSTGRES_SERVER
              value: mealie-pg-rw
            - name: POSTGRES_PORT
              value: '5432'
            - name: POSTGRES_DB
              value: mealie
            - name: SCRAPER_FLARESOLVERR_URL
              value: http://localhost:8191
          envFrom:
            - secretRef:
                name: envsecrets
          ports:
            - containerPort: 9000
              name: web
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /app/data
        - name: flaresolverr
          image: docker.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 1000
            runAsNonRoot: true
            capabilities:
              drop:
              - ALL
          env:
            - name: LOG_LEVEL
              value: 'info'
            - name: LOG_HTML
              value: 'false'
            - name: CAPTCHA_SOLVER
              value: 'none'
            - name: TZ
              value: Europe/Helsinki
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mealie
