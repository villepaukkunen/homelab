apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: server-plan
  namespace: system-upgrade
spec:
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: In
        values:
          - "true"
  serviceAccountName: system-upgrade
  upgrade:
    image: rancher/k3s-upgrade@sha256:0c8c89e3f3f9f1731ebb01e278ef3cead221e0a442385fc32a3bf0c8259551e4
  version: v1.36.5+k3s1
---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: agent-plan
  namespace: system-upgrade
spec:
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
    - key: node-role.kubernetes.io/control-plane
      operator: DoesNotExist
  prepare:
    args:
    - prepare
    - server-plan
    image: rancher/k3s-upgrade@sha256:0c8c89e3f3f9f1731ebb01e278ef3cead221e0a442385fc32a3bf0c8259551e4
  serviceAccountName: system-upgrade
  upgrade:
    image: rancher/k3s-upgrade@sha256:0c8c89e3f3f9f1731ebb01e278ef3cead221e0a442385fc32a3bf0c8259551e4
  version: v1.36.5+k3s1