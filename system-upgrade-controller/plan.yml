apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: server-plan
  namespace: system-upgrade
spec:
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: In
        values:
          - "true"
  serviceAccountName: system-upgrade
  upgrade:
    image: rancher/k3s-upgrade@sha256:9c30e9888ca8b80e8f52f95fc4776c2f3ea7f6837761c939320a0e27038762e3
  version: v1.36.5+k3s1
---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: agent-plan
  namespace: system-upgrade
spec:
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
    - key: node-role.kubernetes.io/control-plane
      operator: DoesNotExist
  prepare:
    args:
    - prepare
    - server-plan
    image: rancher/k3s-upgrade@sha256:9c30e9888ca8b80e8f52f95fc4776c2f3ea7f6837761c939320a0e27038762e3
  serviceAccountName: system-upgrade
  upgrade:
    image: rancher/k3s-upgrade@sha256:9c30e9888ca8b80e8f52f95fc4776c2f3ea7f6837761c939320a0e27038762e3
  version: v1.36.5+k3s1