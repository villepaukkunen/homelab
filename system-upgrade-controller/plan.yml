apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: server-plan
  namespace: system-upgrade
spec:
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: In
        values:
          - "true"
  serviceAccountName: system-upgrade
  upgrade:
    image: rancher/k3s-upgrade@sha256:5c7c7152d45c6a1efde4f93b0d2519773b6f78cd120131aa553f826d751f2317
  version: v1.36.6+k3s1
---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: agent-plan
  namespace: system-upgrade
spec:
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
    - key: node-role.kubernetes.io/control-plane
      operator: DoesNotExist
  prepare:
    args:
    - prepare
    - server-plan
    image: rancher/k3s-upgrade@sha256:5c7c7152d45c6a1efde4f93b0d2519773b6f78cd120131aa553f826d751f2317
  serviceAccountName: system-upgrade
  upgrade:
    image: rancher/k3s-upgrade@sha256:5c7c7152d45c6a1efde4f93b0d2519773b6f78cd120131aa553f826d751f2317
  version: v1.36.6+k3s1