common:
  config:
    vectorExtension: ""
  postgres:
    host: immich-pg-rw
    existingSecret:
      enabled: true
      secretName: immich-postgres-credentials
      usernameKey: username
      passwordKey: password
  redis:
    host: immich-valkey-headless
    existingSecret:
      enabled: true
      secretName: immich-valkey-credentials
      passwordKey: password
server:
  image:
    repository: docker.io/altran1502/immich-server
    tag: v3.4.1@sha256:7c489add298fc2f92cda4c777de6462aa206877e04087b815f62c7664af0b53b
    pullPolicy: IfNotPresent
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    runAsUser: 1000
    capabilities:
      drop:
      - ALL
  volumeMounts:
    - name: uploads
      mountPath: /data
  volumes:
    - name: uploads
      persistentVolumeClaim:
        claimName: data
machineLearning:
  enabled: true
  image:
    repository: docker.io/altran1502/immich-machine-learning
    tag: v3.4.1@sha256:8adebf414256f6e4f837bfbb66fa94f14f4da7260e3a1d65cbba49e4e35d8764
    pullPolicy: IfNotPresent
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    runAsUser: 1000
    capabilities:
      drop:
      - ALL
  volumeMounts:
    - mountPath: /.config
      name: emptydir
      subPath: conf-dir
    - mountPath: /.cache
      name: emptydir
      subPath: cache-dir
  volumes:
    - emptyDir: {}
      name: emptydir