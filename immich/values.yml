common:
  config:
    vectorExtension: ""
  postgres:
    host: immich-pg-rw
    existingSecret:
      enabled: true
      secretName: immich-postgres-credentials
      usernameKey: username
      passwordKey: password
  redis:
    host: immich-valkey-headless
    existingSecret:
      enabled: true
      secretName: immich-valkey-credentials
      passwordKey: password
server:
  image:
    repository: docker.io/altran1502/immich-server
    tag: v3.3.4@sha256:f6475c58b07a8d89ec845aa8782731d36656c3c17d943e0a101dc6ed99a2e53f
    pullPolicy: IfNotPresent
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    runAsUser: 1000
    capabilities:
      drop:
      - ALL
  volumeMounts:
    - name: uploads
      mountPath: /data
  volumes:
    - name: uploads
      persistentVolumeClaim:
        claimName: data
machineLearning:
  enabled: true
  image:
    repository: docker.io/altran1502/immich-machine-learning
    tag: v3.3.4@sha256:1ab8674e7cec41009abb3812de62a16cc1917e73d486233a5471b048d26fc14d
    pullPolicy: IfNotPresent
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    runAsUser: 1000
    capabilities:
      drop:
      - ALL
  volumeMounts:
    - mountPath: /.config
      name: emptydir
      subPath: conf-dir
    - mountPath: /.cache
      name: emptydir
      subPath: cache-dir
  volumes:
    - emptyDir: {}
      name: emptydir