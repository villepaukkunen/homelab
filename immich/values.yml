common:
  config:
    vectorExtension: ""
  postgres:
    host: immich-pg-rw
    existingSecret:
      enabled: true
      secretName: immich-postgres-credentials
      usernameKey: username
      passwordKey: password
  redis:
    host: immich-valkey-headless
    existingSecret:
      enabled: true
      secretName: immich-valkey-credentials
      passwordKey: password
server:
  image:
    repository: docker.io/altran1502/immich-server
    tag: v3.4.0@sha256:7b7b575029168bfb9eb901d868ce7dbfda0d7818e78aaace29b7b8a08cd4e7d5
    pullPolicy: IfNotPresent
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    runAsUser: 1000
    capabilities:
      drop:
      - ALL
  volumeMounts:
    - name: uploads
      mountPath: /data
  volumes:
    - name: uploads
      persistentVolumeClaim:
        claimName: data
machineLearning:
  enabled: true
  image:
    repository: docker.io/altran1502/immich-machine-learning
    tag: v3.4.0@sha256:f4e7275c9fbd956ed7bccc738ac57890bcbd9f9c17844d2ea0b137e38a083454
    pullPolicy: IfNotPresent
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    runAsUser: 1000
    capabilities:
      drop:
      - ALL
  volumeMounts:
    - mountPath: /.config
      name: emptydir
      subPath: conf-dir
    - mountPath: /.cache
      name: emptydir
      subPath: cache-dir
  volumes:
    - emptyDir: {}
      name: emptydir